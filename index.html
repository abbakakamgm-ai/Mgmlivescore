<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Football Live</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f5f8;
    color:#17202a;
}

.header{
    background:#0757c9;
    color:white;
    padding:20px 15px 18px;
    text-align:center;
}

.header h1{
    font-size:25px;
    margin-bottom:5px;
}

.header p{
    font-size:13px;
    opacity:.9;
}

.tabs{
    background:white;
    display:flex;
    position:sticky;
    top:0;
    z-index:10;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.tab{
    flex:1;
    border:none;
    background:white;
    padding:15px 5px;
    font-size:14px;
    font-weight:bold;
    color:#777;
    cursor:pointer;
}

.tab.active{
    color:#0757c9;
    border-bottom:3px solid #0757c9;
}

.controls{
    padding:12px;
    display:flex;
    gap:8px;
    background:#f3f5f8;
}

.btn{
    border:none;
    background:#0757c9;
    color:white;
    padding:11px 14px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

.btn.secondary{
    background:white;
    color:#0757c9;
    border:1px solid #d7dce3;
}

.btn:disabled{
    opacity:.5;
}

.statusbar{
    margin:0 12px 10px;
    background:white;
    padding:10px 12px;
    border-radius:8px;
    font-size:12px;
    color:#667085;
}

.container{
    padding:0 12px 30px;
}

.date-title{
    text-align:center;
    font-weight:bold;
    margin:8px 0 12px;
    font-size:14px;
}

.match{
    background:white;
    border-radius:12px;
    margin-bottom:10px;
    padding:13px;
    box-shadow:0 2px 7px rgba(0,0,0,.06);
}

.league{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:11px;
    color:#777;
    margin-bottom:12px;
}

.league-name{
    font-weight:bold;
    color:#555;
}

.country{
    color:#999;
}

.teams{
    display:grid;
    grid-template-columns:1fr 55px 1fr;
    align-items:center;
    gap:5px;
}

.team{
    display:flex;
    align-items:center;
    gap:8px;
}

.team.home{
    justify-content:flex-end;
    text-align:right;
}

.team.away{
    justify-content:flex-start;
    text-align:left;
}

.team img{
    width:32px;
    height:32px;
    object-fit:contain;
}

.team-name{
    font-size:13px;
    font-weight:bold;
    line-height:1.2;
}

.score{
    text-align:center;
    font-size:18px;
    font-weight:bold;
}

.time{
    font-size:11px;
    color:#777;
    margin-top:3px;
}

.match-status{
    text-align:center;
    margin-top:10px;
    font-size:11px;
    font-weight:bold;
    color:#0757c9;
}

.live-status{
    color:#e53935;
}

.finished-status{
    color:#555;
}

.upcoming-status{
    color:#0757c9;
}

.loading{
    text-align:center;
    padding:35px 15px;
    color:#777;
}

.spinner{
    width:30px;
    height:30px;
    border:3px solid #ddd;
    border-top:3px solid #0757c9;
    border-radius:50%;
    animation:spin 1s linear infinite;
    margin:0 auto 12px;
}

@keyframes spin{
    to{transform:rotate(360deg);}
}

.empty{
    background:white;
    border-radius:12px;
    padding:35px 20px;
    text-align:center;
    color:#777;
    margin-top:10px;
}

.empty-icon{
    font-size:35px;
    margin-bottom:10px;
}

.error{
    background:#fff0f0;
    border:1px solid #ffd0d0;
    color:#c62828;
    padding:15px;
    border-radius:10px;
    margin-bottom:10px;
    font-size:13px;
    line-height:1.5;
}

.date-controls{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-bottom:10px;
}

.date-controls button{
    flex:0 0 auto;
}

.current-date{
    flex:1;
    text-align:center;
    background:white;
    border-radius:8px;
    padding:10px 5px;
    font-size:12px;
    font-weight:bold;
}

.pagination{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    margin:18px 0;
}

.page-number{
    font-size:12px;
    color:#777;
}

.footer{
    text-align:center;
    color:#999;
    font-size:10px;
    padding:15px;
}

.hidden{
    display:none !important;
}

@media(max-width:400px){
    .team-name{
        font-size:12px;
    }

    .team img{
        width:28px;
        height:28px;
    }

    .teams{
        grid-template-columns:1fr 50px 1fr;
    }
}
</style>
</head>

<body>

<header class="header">
    <h1>⚽ Football Live</h1>
    <p>Live scores from around the world</p>
</header>

<div class="tabs">
    <button class="tab active" id="liveTab" onclick="switchTab('live')">
        🔴 Live
    </button>

    <button class="tab" id="upcomingTab" onclick="switchTab('upcoming')">
        📅 Upcoming
    </button>

    <button class="tab" id="finishedTab" onclick="switchTab('finished')">
        ✅ Finished
    </button>
</div>

<div class="controls">

    <button class="btn" onclick="manualRefresh()">
        🔄 Refresh
    </button>

</div>

<div class="statusbar" id="statusBar">
    Ready
</div>

<div class="container">

    <!-- DATE CONTROLS -->
    <div id="dateControls" class="date-controls hidden">

        <button class="btn secondary" onclick="changeDate(-1)">
            ◀ Previous
        </button>

        <div class="current-date" id="currentDate">
            Today
        </div>

        <button class="btn secondary" onclick="changeDate(1)">
            Next ▶
        </button>

    </div>

    <div id="dateTitle" class="date-title hidden"></div>

    <div id="content"></div>

    <!-- CLIENT-SIDE PAGINATION -->
    <div id="pagination" class="pagination hidden">

        <button class="btn secondary" id="prevPage" onclick="previousPage()">
            ◀
        </button>

        <span class="page-number" id="pageNumber">
            Page 1
        </span>

        <button class="btn secondary" id="nextPage" onclick="nextPage()">
            ▶
        </button>

    </div>

</div>

<div class="footer">
    Football data powered by API-Football
</div>


<script>

/* =========================================================
   API SETTINGS
   ========================================================= */

/*
   PUT YOUR API-FOOTBALL API KEY HERE.

   Example:

   const API_KEY = "123456789abcdef";

   DO NOT put spaces before or after the key.
*/

const API_KEY = "1d022aea6a684ac462fa556bab82b092";


const API_URL =
    "https://v3.football.api-sports.io/fixtures";


/*
   Nigeria timezone
*/
const TIMEZONE = "Africa/Lagos";


/*
   How many matches per page in the app.

   This is CLIENT-SIDE pagination.

   It does NOT make another API request.
*/
const MATCHES_PER_PAGE = 20;


/*
   Cache duration.

   Date fixtures are cached for 10 minutes.
*/
const CACHE_TIME = 10 * 60 * 1000;


/*
   Live automatic refresh.

   20 minutes is intentionally conservative for the
   free 100 requests/day plan.

   You can manually press Refresh at any time.
*/
const LIVE_REFRESH_TIME = 20 * 60 * 1000;


/* =========================================================
   APP VARIABLES
   ========================================================= */

let currentTab = "live";

let currentDate = getNigeriaDate();

let currentPage = 1;

let currentMatches = [];

let liveTimer = null;

let loading = false;


/* =========================================================
   STATUS TYPES
   ========================================================= */

const LIVE_STATUSES = [
    "1H",
    "HT",
    "2H",
    "ET",
    "BT",
    "P",
    "LIVE"
];

const UPCOMING_STATUSES = [
    "NS",
    "TBD"
];

const FINISHED_STATUSES = [
    "FT",
    "AET",
    "PEN"
];


/* =========================================================
   INITIALIZE
   ========================================================= */

document.addEventListener("DOMContentLoaded", function(){

    if(!API_KEY || API_KEY === "PASTE_YOUR_API_KEY_HERE"){

        showError(
            "API key is missing.<br><br>" +
            "Open the HTML code and replace:<br><br>" +
            "<b>PASTE_YOUR_API_KEY_HERE</b><br><br>" +
            "with your API-Football key."
        );

        return;
    }

    loadLive();

});


/* =========================================================
   NIGERIA DATE
   ========================================================= */

function getNigeriaDate(){

    const now = new Date();

    return new Intl.DateTimeFormat(
        "en-CA",
        {
            timeZone: TIMEZONE,
            year: "numeric",
            month: "2-digit",
            day: "2-digit"
        }
    ).format(now);

}


/* =========================================================
   CHANGE DATE
   ========================================================= */

function changeDate(days){

    const date = new Date(currentDate + "T12:00:00");

    date.setDate(
        date.getDate() + days
    );

    currentDate =
        date.toISOString().split("T")[0];

    currentPage = 1;

    updateDateDisplay();

    if(currentTab === "upcoming"){

        loadDateMatches("upcoming");

    }

    else if(currentTab === "finished"){

        loadDateMatches("finished");

    }

}


/* =========================================================
   DATE DISPLAY
   ========================================================= */

function updateDateDisplay(){

    const dateObject =
        new Date(currentDate + "T12:00:00");

    const formatted =
        dateObject.toLocaleDateString(
            "en-NG",
            {
                weekday:"short",
                day:"numeric",
                month:"short",
                year:"numeric"
            }
        );

    document.getElementById("currentDate").innerText =
        formatted;

}


/* =========================================================
   SWITCH TABS
   ========================================================= */

function switchTab(tab){

    currentTab = tab;

    currentPage = 1;

    document
        .getElementById("liveTab")
        .classList.remove("active");

    document
        .getElementById("upcomingTab")
        .classList.remove("active");

    document
        .getElementById("finishedTab")
        .classList.remove("active");


    document
        .getElementById(tab + "Tab")
        .classList.add("active");


    clearInterval(liveTimer);

    liveTimer = null;


    if(tab === "live"){

        document
            .getElementById("dateControls")
            .classList.add("hidden");

        document
            .getElementById("dateTitle")
            .classList.add("hidden");

        loadLive();

    }

    else{

        document
            .getElementById("dateControls")
            .classList.remove("hidden");

        document
            .getElementById("dateTitle")
            .classList.remove("hidden");

        updateDateDisplay();

        loadDateMatches(tab);

    }

}


/* =========================================================
   API FETCH FUNCTION
   ========================================================= */

async function apiRequest(parameters){

    /*
       Build URL safely.

       IMPORTANT:
       We only send the parameters that are actually needed.
    */

    const query =
        new URLSearchParams(parameters);

    const url =
        API_URL + "?" + query.toString();


    const response =
        await fetch(
            url,
            {
                method:"GET",

                headers:{
                    "x-apisports-key":API_KEY
                }
            }
        );


    /*
       If server returns HTTP error
    */

    if(!response.ok){

        throw new Error(
            "HTTP error " + response.status
        );

    }


    const data =
        await response.json();


    /*
       API-Football can return errors inside JSON.
    */

    if(
        data.errors &&
        Object.keys(data.errors).length > 0
    ){

        let messages = [];

        Object.keys(data.errors).forEach(function(key){

            messages.push(
                key + ": " + data.errors[key]
            );

        });

        throw new Error(
            messages.join("<br>")
        );

    }


    return data;

}


/* =========================================================
   LIVE MATCHES
   ========================================================= */

async function loadLive(){

    if(loading) return;

    loading = true;

    showLoading("Loading live matches...");


    try{

        /*
           LIVE REQUEST

           This is the important request:

           /fixtures?live=all

           No from
           No to
           No page
           No date
        */

        const data =
            await apiRequest({
                live:"all"
            });


        currentMatches =
            data.response || [];


        currentPage = 1;


        renderMatches(
            currentMatches,
            "live"
        );


        updateStatus(
            "Live connection • " +
            currentMatches.length +
            " live match" +
            (currentMatches.length === 1 ? "" : "es") +
            " • " +
            getCurrentTime()
        );


        /*
           Automatic refresh.

           We don't run it repeatedly while another
           request is running.
        */

        clearInterval(liveTimer);

        liveTimer =
            setInterval(
                function(){

                    if(
                        currentTab === "live" &&
                        !document.hidden
                    ){

                        loadLive();

                    }

                },
                LIVE_REFRESH_TIME
            );


    }

    catch(error){

        showError(
            "Could not load live matches.<br><br>" +
            error.message
        );

    }

    finally{

        loading = false;

    }

}


/* =========================================================
   UPCOMING / FINISHED
   ========================================================= */

async function loadDateMatches(type){

    if(loading) return;

    loading = true;

    showLoading(
        type === "upcoming"
        ? "Loading upcoming matches..."
        : "Loading finished matches..."
    );


    try{

        /*
           IMPORTANT:

           We use ONLY:

           date
           timezone

           This avoids the previous API error caused by
           From / To / Page parameters.
        */

        const data =
            await getCachedDateFixtures(
                currentDate
            );


        let matches =
            data.response || [];


        /*
           Separate matches by status.
        */

        if(type === "upcoming"){

            currentMatches =
                matches.filter(function(match){

                    return UPCOMING_STATUSES.includes(
                        match.fixture.status.short
                    );

                });

        }

        else{

            currentMatches =
                matches.filter(function(match){

                    return FINISHED_STATUSES.includes(
                        match.fixture.status.short
                    );

                });

        }


        currentPage = 1;


        renderMatches(
            currentMatches,
            type
        );


        updateStatus(
            formatDate(currentDate) +
            " • " +
            currentMatches.length +
            " match" +
            (currentMatches.length === 1 ? "" : "es")
        );


    }

    catch(error){

        showError(
            "Could not load matches.<br><br>" +
            error.message
        );

    }

    finally{

        loading = false;

    }

}


/* =========================================================
   DATE FIXTURES WITH CACHE
   ========================================================= */

async function getCachedDateFixtures(date){

    const cacheKey =
        "football_fixtures_" + date;


    /*
       Check localStorage
    */

    try{

        const cached =
            localStorage.getItem(cacheKey);


        if(cached){

            const parsed =
                JSON.parse(cached);


            if(
                Date.now() - parsed.time
                < CACHE_TIME
            ){

                return parsed.data;

            }

        }

    }

    catch(e){

        console.log(
            "Cache read error",
            e
        );

    }


    /*
       API request

       IMPORTANT:

       Only date + timezone.
    */

    const data =
        await apiRequest({
            date:date,
            timezone:TIMEZONE
        });


    /*
       Save result
    */

    try{

        localStorage.setItem(
            cacheKey,
            JSON.stringify({
                time:Date.now(),
                data:data
            })
        );

    }

    catch(e){

        console.log(
            "Cache save error",
            e
        );

    }


    return data;

}


/* =========================================================
   RENDER MATCHES
   ========================================================= */

function renderMatches(matches,type){

    const content =
        document.getElementById("content");


    document
        .getElementById("pagination")
        .classList.add("hidden");


    if(!matches || matches.length === 0){

        let message = "";

        if(type === "live"){

            message =
                "No live matches right now.";

        }

        else if(type === "upcoming"){

            message =
                "No upcoming matches found for this date.";

        }

        else{

            message =
                "No finished matches found for this date.";

        }


        content.innerHTML = `
            <div class="empty">
                <div class="empty-icon">
                    ${type === "live" ? "⚽" : "📅"}
                </div>

                <div>${message}</div>
            </div>
        `;

        return;

    }


    /*
       Sort matches by kickoff time.
    */

    matches =
        [...matches].sort(
            function(a,b){

                return new Date(a.fixture.date)
                    -
                    new Date(b.fixture.date);

            }
        );


    currentMatches = matches;


    /*
       CLIENT-SIDE PAGINATION

       This does NOT call the API again.
    */

    const start =
        (currentPage - 1)
        * MATCHES_PER_PAGE;


    const end =
        start + MATCHES_PER_PAGE;


    const pageMatches =
        matches.slice(
            start,
            end
        );


    let html = "";


    pageMatches.forEach(function(match){

        html += createMatchCard(
            match,
            type
        );

    });


    content.innerHTML = html;


    updatePagination();

}


/* =========================================================
   CREATE MATCH CARD
   ========================================================= */

function createMatchCard(match,type){

    const fixture =
        match.fixture || {};

    const teams =
        match.teams || {};

    const league =
        match.league || {};

    const goals =
        match.goals || {};

    const status =
        fixture.status || {};


    const home =
        teams.home || {};

    const away =
        teams.away || {};


    const homeScore =
        goals.home !== null &&
        goals.home !== undefined
        ? goals.home
        : "-";


    const awayScore =
        goals.away !== null &&
        goals.away !== undefined
        ? goals.away
        : "-";


    const kickoff =
        formatTime(
            fixture.date
        );


    let statusText =
        status.short || "";


    let statusClass =
        "";


    /*
       LIVE
    */

    if(LIVE_STATUSES.includes(status.short)){

        statusClass =
            "live-status";

        if(status.elapsed !== null){

            statusText =
                "🔴 " +
                status.elapsed +
                "' LIVE";

        }

        else{

            statusText =
                "🔴 LIVE";

        }

    }


    /*
       FINISHED
    */

    else if(FINISHED_STATUSES.includes(status.short)){

        statusClass =
            "finished-status";

        statusText =
            status.short === "FT"
            ? "Finished"
            : status.short;

    }


    /*
       UPCOMING
    */

    else if(UPCOMING_STATUSES.includes(status.short)){

        statusClass =
            "upcoming-status";

        statusText =
            kickoff;

    }


    return `

        <div class="match">

            <div class="league">

                <span class="league-name">
                    ${escapeHTML(
                        league.name || "Football"
                    )}
                </span>

                <span class="country">
                    ${escapeHTML(
                        league.country || ""
                    )}
                </span>

            </div>


            <div class="teams">


                <!-- HOME -->

                <div class="team home">

                    <span class="team-name">
                        ${escapeHTML(
                            home.name || "Home"
                        )}
                    </span>

                    ${
                        home.logo
                        ?
                        `<img
                            src="${escapeAttribute(home.logo)}"
                            alt=""
                            onerror="this.style.display='none'"
                        >`
                        :
                        ""
                    }

                </div>


                <!-- SCORE -->

                <div class="score">

                    <div>
                        ${homeScore}
                        -
                        ${awayScore}
                    </div>

                </div>


                <!-- AWAY -->

                <div class="team away">

                    ${
                        away.logo
                        ?
                        `<img
                            src="${escapeAttribute(away.logo)}"
                            alt=""
                            onerror="this.style.display='none'"
                        >`
                        :
                        ""
                    }

                    <span class="team-name">
                        ${escapeHTML(
                            away.name || "Away"
                        )}
                    </span>

                </div>

            </div>


            <div class="match-status ${statusClass}">

                ${escapeHTML(statusText)}

            </div>

        </div>

    `;

}


/* =========================================================
   PAGINATION
   ========================================================= */

function updatePagination(){

    const totalPages =
        Math.ceil(
            currentMatches.length
            /
            MATCHES_PER_PAGE
        );


    const pagination =
        document.getElementById("pagination");


    if(totalPages <= 1){

        pagination.classList.add("hidden");

        return;

    }


    pagination.classList.remove("hidden");


    document.getElementById("pageNumber")
        .innerText =
        "Page " +
        currentPage +
        " of " +
        totalPages;


    document.getElementById("prevPage")
        .disabled =
        currentPage <= 1;


    document.getElementById("nextPage")
        .disabled =
        currentPage >= totalPages;

}


function nextPage(){

    const totalPages =
        Math.ceil(
            currentMatches.length
            /
            MATCHES_PER_PAGE
        );


    if(currentPage < totalPages){

        currentPage++;

        renderMatches(
            currentMatches,
            currentTab
        );

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }

}


function previousPage(){

    if(currentPage > 1){

        currentPage--;

        renderMatches(
            currentMatches,
            currentTab
        );

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }

}


/* =========================================================
   MANUAL REFRESH
   ========================================================= */

function manualRefresh(){

    /*
       Remove cache for selected date.
    */

    if(
        currentTab === "upcoming" ||
        currentTab === "finished"
    ){

        try{

            localStorage.removeItem(
                "football_fixtures_" +
                currentDate
            );

        }

        catch(e){}

    }


    if(currentTab === "live"){

        loadLive();

    }

    else{

        loadDateMatches(
            currentTab
        );

    }

}


/* =========================================================
   LOADING
   ========================================================= */

function showLoading(message){

    document.getElementById("content")
        .innerHTML = `

            <div class="loading">

                <div class="spinner"></div>

                ${message}

            </div>
        `;


    document.getElementById("pagination")
        .classList.add("hidden");

}


/* =========================================================
   ERROR
   ========================================================= */

function showError(message){

    document.getElementById("content")
        .innerHTML = `

            <div class="error">

                <b>⚠️ API Error</b>

                <br><br>

                ${message}

            </div>
        `;

}


/* =========================================================
   STATUS BAR
   ========================================================= */

function updateStatus(message){

    document.getElementById("statusBar")
        .innerText =
        message;

}


/* =========================================================
   TIME
   ========================================================= */

function formatTime(dateString){

    try{

        return new Intl.DateTimeFormat(
            "en-NG",
            {
                timeZone:TIMEZONE,
                hour:"2-digit",
                minute:"2-digit",
                hour12:true
            }
        ).format(
            new Date(dateString)
        );

    }

    catch(e){

        return "";

    }

}


/* =========================================================
   CURRENT TIME
   ========================================================= */

function getCurrentTime(){

    return new Intl.DateTimeFormat(
        "en-NG",
        {
            timeZone:TIMEZONE,
            hour:"2-digit",
            minute:"2-digit",
            second:"2-digit",
            hour12:true
        }
    ).format(
        new Date()
    );

}


/* =========================================================
   FORMAT DATE
   ========================================================= */

function formatDate(date){

    const d =
        new Date(
            date + "T12:00:00"
        );


    return d.toLocaleDateString(
        "en-NG",
        {
            weekday:"long",
            day:"numeric",
            month:"long",
            year:"numeric"
        }
    );

}


/* =========================================================
   SECURITY / HTML ESCAPING
   ========================================================= */

function escapeHTML(value){

    if(value === null ||
       value === undefined){

        return "";

    }


    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function escapeAttribute(value){

    return escapeHTML(value);

}


/* =========================================================
   STOP REFRESH WHEN APP IS NOT VISIBLE
   ========================================================= */

document.addEventListener(
    "visibilitychange",
    function(){

        if(document.hidden){

            clearInterval(liveTimer);

        }

        else if(
            currentTab === "live"
        ){

            loadLive();

        }

    }
);

</script>
