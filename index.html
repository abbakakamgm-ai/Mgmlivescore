<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Football Live Scores</title>

<style>

/* =========================
   RESET
========================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}


/* =========================
   BODY
========================= */

body{

    font-family:
    Arial,
    Helvetica,
    sans-serif;

    background:#f4f6f9;

    color:#17202a;

    padding-bottom:40px;
}


/* =========================
   HEADER
========================= */

.header{

    background:
    linear-gradient(
        135deg,
        #061b45,
        #075cff
    );

    color:white;

    padding:
    25px
    18px
    28px;

    border-radius:
    0 0 28px 28px;

}


.header h1{

    font-size:29px;

    margin-bottom:7px;

}


.header p{

    font-size:14px;

    opacity:.85;

}


.refresh-row{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-top:22px;

}


#lastUpdate{

    font-size:13px;

    opacity:.9;

}


.refresh-btn{

    border:none;

    background:white;

    color:#075cff;

    padding:
    12px
    18px;

    border-radius:25px;

    font-size:15px;

    font-weight:bold;

}


/* =========================
   TABS
========================= */

.tabs{

    display:flex;

    gap:10px;

    overflow-x:auto;

    padding:
    18px
    15px
    12px;

    scrollbar-width:none;

}


.tabs::-webkit-scrollbar{

    display:none;

}


.tab{

    flex:none;

    border:none;

    background:white;

    color:#555;

    padding:
    12px
    22px;

    border-radius:25px;

    font-size:15px;

    font-weight:bold;

    box-shadow:
    0 2px 8px
    rgba(0,0,0,.05);

}


.tab.active{

    background:#075cff;

    color:white;

}


/* =========================
   ERROR
========================= */

#error{

    display:none;

    margin:
    10px
    15px;

    padding:16px;

    border-radius:14px;

    background:#ffe8e8;

    color:#c62828;

    font-size:14px;

    line-height:1.5;

    word-break:break-word;

}


/* =========================
   LOADING
========================= */

.loading{

    text-align:center;

    padding:
    50px
    20px;

    color:#777;

}


.spinner{

    width:42px;

    height:42px;

    border:
    4px solid #ddd;

    border-top:
    4px solid #075cff;

    border-radius:50%;

    margin:
    0 auto
    15px;

    animation:
    spin 1s linear infinite;

}


@keyframes spin{

    to{

        transform:
        rotate(360deg);

    }

}


/* =========================
   SECTION TITLE
========================= */

.section-title{

    padding:
    8px
    16px
    10px;

    font-size:19px;

    font-weight:bold;

}


/* =========================
   MATCH CARD
========================= */

.match{

    background:white;

    margin:
    10px
    15px;

    padding:15px;

    border-radius:18px;

    box-shadow:
    0 3px 15px
    rgba(0,0,0,.06);

}


/* =========================
   LEAGUE
========================= */

.league{

    display:flex;

    align-items:center;

    gap:8px;

    padding-bottom:12px;

    margin-bottom:14px;

    border-bottom:
    1px solid #eee;

}


.league-logo{

    width:28px;

    height:28px;

    object-fit:contain;

}


.league-name{

    font-size:12px;

    color:#777;

    font-weight:bold;

}


/* =========================
   MATCH ROW
========================= */

.match-row{

    display:grid;

    grid-template-columns:
    1fr
    80px
    1fr;

    align-items:center;

    text-align:center;

}


/* =========================
   TEAM
========================= */

.team{

    font-size:13px;

    font-weight:bold;

    line-height:1.3;

}


.team-logo{

    display:block;

    width:46px;

    height:46px;

    object-fit:contain;

    margin:
    0 auto
    8px;

}


/* =========================
   SCORE
========================= */

.score{

    font-size:23px;

    font-weight:bold;

}


.status{

    margin-top:6px;

    font-size:11px;

    font-weight:bold;

    color:#777;

}


.live-status{

    color:#e53935;

}


.live-dot{

    display:inline-block;

    width:8px;

    height:8px;

    background:#e53935;

    border-radius:50%;

    margin-right:4px;

}


/* =========================
   EMPTY
========================= */

.empty{

    text-align:center;

    padding:
    65px
    20px;

    color:#777;

}


.empty-ball{

    font-size:55px;

    margin-bottom:12px;

}


/* =========================
   FOOTER
========================= */

.footer{

    text-align:center;

    color:#999;

    font-size:12px;

    margin-top:30px;

}

</style>

</head>


<body>


<!-- ==================================================
     HEADER
================================================== -->

<div class="header">

    <h1>
        ⚽ Football Live
    </h1>

    <p>
        Live scores from around the world
    </p>


    <div class="refresh-row">

        <span id="lastUpdate">
            Connecting...
        </span>


        <button
            class="refresh-btn"
            onclick="loadEverything()">

            ↻ Refresh

        </button>

    </div>

</div>



<!-- ==================================================
     TABS
================================================== -->

<div class="tabs">


    <button
        class="tab active"
        onclick="
            changeTab('live',this)
        ">

        🔴 Live

    </button>


    <button
        class="tab"
        onclick="
            changeTab('upcoming',this)
        ">

        🕐 Upcoming

    </button>


    <button
        class="tab"
        onclick="
            changeTab('finished',this)
        ">

        ✅ Finished

    </button>


</div>



<!-- ==================================================
     ERROR
================================================== -->

<div id="error"></div>



<!-- ==================================================
     LOADING
================================================== -->

<div
    id="loading"
    class="loading">

    <div class="spinner"></div>

    Loading football matches...

</div>



<!-- ==================================================
     MATCHES
================================================== -->

<div id="matches"></div>



<div class="footer">

    Football Live Scores

</div>



<script>


/* ==================================================
   🔑 YOUR API KEY
================================================== */

const API_KEY =
"c0f0b043b7eb3bd45beb90bf444fbc8b";


/* ==================================================
   API URL
================================================== */

const API_URL =
"https://v3.football.api-sports.io";


/* ==================================================
   VARIABLES
================================================== */

let liveMatches = [];

let upcomingMatches = [];

let finishedMatches = [];

let currentTab = "live";


/* ==================================================
   DATE FUNCTION
================================================== */

function formatDate(date){

    const year =
        date.getFullYear();

    const month =
        String(
            date.getMonth() + 1
        ).padStart(2,"0");

    const day =
        String(
            date.getDate()
        ).padStart(2,"0");

    return (
        year +
        "-" +
        month +
        "-" +
        day
    );

}


/* ==================================================
   GET DATE WITH OFFSET
================================================== */

function getDate(offset){

    const date =
        new Date();

    date.setDate(
        date.getDate() + offset
    );

    return formatDate(date);

}


/* ==================================================
   API REQUEST
================================================== */

async function requestAPI(endpoint){

    const response =
        await fetch(
            API_URL + endpoint,
            {

                method:"GET",

                headers:{

                    "x-apisports-key":
                    API_KEY

                }

            }
        );


    if(!response.ok){

        throw new Error(
            "HTTP error: " +
            response.status
        );

    }


    const data =
        await response.json();


    console.log(
        endpoint,
        data
    );


    /* API ERROR */

    if(
        data.errors &&
        Object.keys(data.errors).length
        > 0
    ){

        throw new Error(
            JSON.stringify(
                data.errors
            )
        );

    }


    return data.response || [];

}


/* ==================================================
   LOAD EVERYTHING
================================================== */

async function loadEverything(){

    const loading =
        document.getElementById(
            "loading"
        );


    const error =
        document.getElementById(
            "error"
        );


    loading.style.display =
        "block";


    error.style.display =
        "none";


    document.getElementById(
        "matches"
    ).innerHTML = "";


    /* CHECK KEY */

    if(
        API_KEY ===
        "PASTE_YOUR_API_KEY_HERE"
        ||
        API_KEY.trim() === ""
    ){

        loading.style.display =
            "none";


        error.style.display =
            "block";


        error.innerHTML =
        "⚠️ Please put your API-Football API key in the code.";

        return;

    }


    try{


        /* =================================================
           1. LIVE MATCHES

           This returns LIVE matches
           worldwide.
        ================================================= */

        liveMatches =
            await requestAPI(
                "/fixtures?live=all"
            );


        /* =================================================
           2. FINISHED MATCHES

           Yesterday + today
        ================================================= */

        const yesterday =
            getDate(-1);

        const today =
            getDate(0);


        const finishedData =
            await requestAPI(

                "/fixtures" +

                "?from=" +
                yesterday +

                "&to=" +
                today +

                "&timezone=Africa/Lagos"

            );


        finishedMatches =
            finishedData.filter(
                match => isFinished(match)
            );


        /* =================================================
           3. UPCOMING

           Today + next 7 days
        ================================================= */

        const futureDate =
            getDate(7);


        const upcomingData =
            await requestAPI(

                "/fixtures" +

                "?from=" +
                today +

                "&to=" +
                futureDate +

                "&timezone=Africa/Lagos"

            );


        upcomingMatches =
            upcomingData.filter(
                match => isUpcoming(match)
            );


        /* =================================================
           REMOVE DUPLICATES
        ================================================= */

        liveMatches =
            removeDuplicates(
                liveMatches
            );


        finishedMatches =
            removeDuplicates(
                finishedMatches
            );


        upcomingMatches =
            removeDuplicates(
                upcomingMatches
            );


        /* =================================================
           UPDATED TIME
        ================================================= */

        document.getElementById(
            "lastUpdate"
        ).innerText =

            "Updated " +

            new Date()
            .toLocaleTimeString(
                "en-NG"
            );


        loading.style.display =
            "none";


        displayMatches();


    }


    catch(errorObject){

        console.log(
            "ERROR:",
            errorObject
        );


        loading.style.display =
            "none";


        error.style.display =
            "block";


        error.innerHTML =

            "❌ Could not load football data." +

            "<br><br>" +

            "<b>API response:</b><br>" +

            errorObject.message +

            "<br><br>" +

            "Check your API key and API-Football account.";

    }

}


/* ==================================================
   REMOVE DUPLICATES
================================================== */

function removeDuplicates(matches){

    const seen =
        new Set();

    return matches.filter(
        match => {

            const id =
                match.fixture.id;


            if(seen.has(id)){

                return false;

            }


            seen.add(id);

            return true;

        }
    );

}


/* ==================================================
   LIVE STATUS
================================================== */

function isLive(match){

    const status =
        match.fixture.status.short;


    return [

        "1H",
        "HT",
        "2H",
        "ET",
        "BT",
        "P",
        "LIVE"

    ].includes(status);

}


/* ==================================================
   FINISHED STATUS
================================================== */

function isFinished(match){

    const status =
        match.fixture.status.short;


    return [

        "FT",
        "AET",
        "PEN"

    ].includes(status);

}


/* ==================================================
   UPCOMING STATUS
================================================== */

function isUpcoming(match){

    const status =
        match.fixture.status.short;


    return [

        "NS",
        "TBD"

    ].includes(status);

}


/* ==================================================
   DISPLAY MATCHES
================================================== */

function displayMatches(){

    const container =
        document.getElementById(
            "matches"
        );


    let matches = [];

    let title = "";


    /* LIVE */

    if(currentTab === "live"){

        matches =
            liveMatches;

        title =
            "🔴 Live Matches";

    }


    /* UPCOMING */

    else if(
        currentTab === "upcoming"
    ){

        matches =
            upcomingMatches;

        title =
            "🕐 Upcoming Matches";

    }


    /* FINISHED */

    else if(
        currentTab === "finished"
    ){

        matches =
            finishedMatches;

        title =
            "✅ Finished Matches";

    }


    /* SORT */

    matches.sort(
        (a,b) => {

            return (

                new Date(
                    a.fixture.date
                )

                -

                new Date(
                    b.fixture.date
                )

            );

        }
    );


    /* EMPTY */

    if(matches.length === 0){

        let message =
            "No matches found.";


        if(currentTab === "live"){

            message =
                "No football matches are live right now.";

        }


        if(
            currentTab === "upcoming"
        ){

            message =
                "No upcoming matches found.";

        }


        if(
            currentTab === "finished"
        ){

            message =
                "No finished matches found.";

        }


        container.innerHTML = `

            <div class="empty">

                <div class="empty-ball">
                    ⚽
                </div>

                <div>
                    ${message}
                </div>

            </div>

        `;

        return;

    }


    /* TITLE */

    container.innerHTML = `

        <div class="section-title">

            ${title}

            (${matches.length})

        </div>

    `;


    /* CARDS */

    matches.forEach(
        match => {

            container.innerHTML +=
                createMatchCard(match);

        }
    );

}


/* ==================================================
   MATCH CARD
================================================== */

function createMatchCard(match){

    const fixture =
        match.fixture;


    const teams =
        match.teams;


    const goals =
        match.goals;


    const league =
        match.league;


    const status =
        fixture.status.short;


    /* SCORES */

    const homeScore =
        goals.home !== null
        ? goals.home
        : "-";


    const awayScore =
        goals.away !== null
        ? goals.away
        : "-";


    /* STATUS TEXT */

    let statusText = "";


    /* LIVE */

    if(isLive(match)){

        if(status === "HT"){

            statusText =
            `<span class="live-status">
                🔴 HALF TIME
            </span>`;

        }

        else{

            const minute =
                fixture.status.elapsed
                ?
                fixture.status.elapsed + "'"
                :
                "LIVE";


            statusText =
            `<span class="live-status">

                <span
                    class="live-dot">
                </span>

                ${minute}

            </span>`;

        }

    }


    /* FINISHED */

    else if(
        isFinished(match)
    ){

        statusText =
            "FULL TIME";

    }


    /* UPCOMING */

    else{

        const matchDate =
            new Date(
                fixture.date
            );


        statusText =
            matchDate.toLocaleTimeString(

                "en-NG",

                {

                    hour:"2-digit",

                    minute:"2-digit"

                }

            );

    }


    return `

        <div class="match">


            <!-- LEAGUE -->

            <div class="league">


                <img

                    class="league-logo"

                    src="${
                        league.logo || ""
                    }"

                    onerror="
                        this.style.display='none'
                    "

                >


                <div
                    class="league-name">

                    ${
                        league.name ||
                        "Football"
                    }

                    ${
                        league.country
                        ?
                        " • " +
                        league.country
                        :
                        ""
                    }

                </div>


            </div>



            <!-- MATCH -->

            <div class="match-row">


                <!-- HOME -->

                <div class="team">


                    <img

                        class="team-logo"

                        src="${
                            teams.home.logo ||
                            ""
                        }"

                        onerror="
                            this.style.display='none'
                        "

                    >


                    ${
                        teams.home.name
                    }


                </div>



                <!-- SCORE -->

                <div>


                    <div class="score">

                        ${
                            homeScore
                        }

                        -

                        ${
                            awayScore
                        }

                    </div>


                    <div class="status">

                        ${
                            statusText
                        }

                    </div>


                </div>



                <!-- AWAY -->

                <div class="team">


                    <img

                        class="team-logo"

                        src="${
                            teams.away.logo ||
                            ""
                        }"

                        onerror="
                            this.style.display='none'
                        "

                    >


                    ${
                        teams.away.name
                    }


                </div>


            </div>


        </div>

    `;

}


/* ==================================================
   CHANGE TAB
================================================== */

function changeTab(
    tab,
    button
){

    currentTab =
        tab;


    document
        .querySelectorAll(
            ".tab"
        )
        .forEach(
            btn => {

                btn.classList.remove(
                    "active"
                );

            }
        );


    button.classList.add(
        "active"
    );


    displayMatches();

}


/* ==================================================
   AUTO REFRESH
================================================== */

/*
   Live scores refresh every 30 seconds.
*/

setInterval(

    function(){

        loadEverything();

    },

    30000

);


/* ==================================================
   START
================================================== */

loadEverything();


</script>

</body>

</html>
