<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0, user-scalable=no">

<title>Football Live</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f3f5f9;
    color: #222;
    padding-bottom: 30px;
}

/* HEADER */
.header {
    background: linear-gradient(135deg, #073b9c, #0865f5);
    color: white;
    padding: 32px 20px 28px;
    border-radius: 0 0 38px 38px;
}

.header-title {
    display: flex;
    align-items: center;
    gap: 12px;
}

.header-title .ball {
    font-size: 48px;
}

.header-title h1 {
    font-size: 34px;
    font-weight: 800;
}

.subtitle {
    margin-top: 8px;
    font-size: 17px;
    opacity: 0.9;
}

.header-bottom {
    margin-top: 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.connection {
    font-size: 16px;
}

.refresh-btn {
    border: none;
    background: white;
    color: #0865f5;
    font-size: 16px;
    font-weight: bold;
    padding: 15px 22px;
    border-radius: 35px;
    cursor: pointer;
}

.refresh-btn:active {
    transform: scale(0.96);
}

/* TABS */
.tabs {
    display: flex;
    gap: 12px;
    padding: 20px 12px 10px;
    overflow-x: auto;
}

.tab {
    flex: 1;
    min-width: 120px;
    border: none;
    background: white;
    padding: 17px 12px;
    border-radius: 35px;
    font-size: 16px;
    font-weight: bold;
    color: #555;
    box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    cursor: pointer;
}

.tab.active {
    background: #0865f5;
    color: white;
}

/* CONTENT */
.container {
    padding: 10px 15px 30px;
}

.section-title {
    font-size: 20px;
    font-weight: bold;
    margin: 15px 5px;
}

/* MATCH CARD */
.match-card {
    background: white;
    border-radius: 18px;
    margin-bottom: 12px;
    padding: 15px;
    box-shadow: 0 3px 15px rgba(0,0,0,0.06);
}

.league {
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: #777;
    font-size: 12px;
    margin-bottom: 13px;
}

.league-name {
    font-weight: bold;
}

.match-date {
    color: #999;
}

.teams {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.team {
    width: 37%;
    text-align: center;
}

.team img {
    width: 42px;
    height: 42px;
    object-fit: contain;
    margin-bottom: 7px;
}

.team-name {
    font-size: 14px;
    font-weight: bold;
    line-height: 18px;
}

.score-area {
    width: 25%;
    text-align: center;
}

.score {
    font-size: 24px;
    font-weight: 800;
}

.status {
    margin-top: 5px;
    font-size: 12px;
    font-weight: bold;
    color: #777;
}

.status.live {
    color: #e53935;
}

.status.finished {
    color: #555;
}

.status.upcoming {
    color: #0865f5;
}

/* EMPTY */
.empty {
    text-align: center;
    padding: 60px 20px;
    color: #777;
}

.empty-ball {
    font-size: 65px;
    margin-bottom: 15px;
}

.empty-text {
    font-size: 18px;
}

/* ERROR */
.error-box {
    background: #ffe8e8;
    color: #bd2525;
    border-radius: 16px;
    padding: 18px;
    margin: 15px 0;
    line-height: 22px;
}

.error-title {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 10px;
}

/* LOADING */
.loading {
    text-align: center;
    padding: 45px 20px;
    color: #777;
}

.spinner {
    width: 35px;
    height: 35px;
    border: 4px solid #ddd;
    border-top: 4px solid #0865f5;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 15px;
}

@keyframes spin {
    100% {
        transform: rotate(360deg);
    }
}

/* PAGINATION */
.pagination {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    margin: 22px 0;
}

.page-btn {
    border: none;
    background: #0865f5;
    color: white;
    padding: 12px 18px;
    border-radius: 25px;
    font-weight: bold;
    cursor: pointer;
}

.page-btn:disabled {
    background: #ccc;
    cursor: not-allowed;
}

.page-info {
    font-weight: bold;
    color: #555;
}

/* LAST UPDATED */
.updated {
    text-align: center;
    color: #999;
    font-size: 12px;
    margin-top: 5px;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">

    <div class="header-title">
        <div class="ball">⚽</div>
        <div>
            <h1>Football Live</h1>
        </div>
    </div>

    <div class="subtitle">
        Live scores from around the world
    </div>

    <div class="header-bottom">

        <div id="connection" class="connection">
            Connecting...
        </div>

        <button class="refresh-btn" onclick="manualRefresh()">
            ↻ Refresh
        </button>

    </div>
</div>


<!-- TABS -->
<div class="tabs">

    <button id="tabLive"
            class="tab active"
            onclick="changeTab('live')">
        🔴 Live
    </button>

    <button id="tabUpcoming"
            class="tab"
            onclick="changeTab('upcoming')">
        🕐 Upcoming
    </button>

    <button id="tabFinished"
            class="tab"
            onclick="changeTab('finished')">
        ✅ Finished
    </button>

</div>


<!-- CONTENT -->
<div class="container">

    <div id="error"></div>

    <div id="content"></div>

    <div id="updated" class="updated"></div>

</div>


<script>

/* =====================================================
   API SETTINGS
   ===================================================== */

/*
   PUT YOUR API-FOOTBALL KEY HERE.

   Example:

   const API_KEY = "abc123xxxxxxxx";

   DO NOT SHARE YOUR API KEY WITH ANYONE.
*/

const API_KEY = "1d022aea6a684ac462fa556bab82b092";

const API_URL = "https://v3.football.api-sports.io";


/* =====================================================
   APP SETTINGS
   ===================================================== */

/*
   Live matches:
   refresh every 60 seconds.

   Upcoming/Finished:
   cached for 10 minutes to save API requests.
*/

const LIVE_REFRESH_TIME = 60000;

const CACHE_TIME = 10 * 60 * 1000;


/*
   Number of matches shown on one screen.

   The API itself handles pagination.
*/

const MATCHES_PER_PAGE = 20;


/*
   How far ahead to search for upcoming games.
*/

const UPCOMING_DAYS = 7;


/*
   How many days backwards for finished games.
*/

const FINISHED_DAYS = 3;


/* =====================================================
   APP STATE
   ===================================================== */

let currentTab = "live";

let liveMatches = [];

let upcomingMatches = [];

let finishedMatches = [];

let upcomingPage = 1;

let finishedPage = 1;

let upcomingTotalPages = 1;

let finishedTotalPages = 1;

let liveLoading = false;

let dataLoading = false;


/* =====================================================
   DATE FUNCTIONS
   ===================================================== */

/*
   Nigeria time zone.
*/

function nigeriaDate(daysFromToday = 0) {

    const now = new Date();

    /*
       Convert current time to Nigeria time.
    */

    const nigeriaTime = new Date(
        now.toLocaleString(
            "en-US",
            {
                timeZone: "Africa/Lagos"
            }
        )
    );

    nigeriaTime.setDate(
        nigeriaTime.getDate() + daysFromToday
    );

    const year = nigeriaTime.getFullYear();

    const month = String(
        nigeriaTime.getMonth() + 1
    ).padStart(2, "0");

    const day = String(
        nigeriaTime.getDate()
    ).padStart(2, "0");

    return `${year}-${month}-${day}`;
}


/* =====================================================
   API REQUEST
   ===================================================== */

async function apiRequest(endpoint) {

    if (
        !API_KEY ||
        API_KEY === "PASTE_YOUR_API_KEY_HERE"
    ) {
        throw new Error(
            "API key is missing. Please put your API-Football key in the API_KEY section."
        );
    }

    const response = await fetch(
        API_URL + endpoint,
        {
            method: "GET",

            headers: {
                "x-apisports-key": API_KEY
            }
        }
    );

    let data;

    try {

        data = await response.json();

    } catch (e) {

        throw new Error(
            "The API returned an invalid response."
        );
    }


    /*
       API-Football error handling.
    */

    if (
        data.errors &&
        Object.keys(data.errors).length > 0
    ) {

        throw new Error(
            Object.values(data.errors).join(" ")
        );
    }


    if (!response.ok) {

        throw new Error(
            "HTTP error " + response.status
        );
    }


    return data;
}


/* =====================================================
   LIVE MATCHES
   ===================================================== */

async function loadLiveMatches() {

    if (liveLoading) {
        return;
    }

    liveLoading = true;

    try {

        showLoading();

        const data = await apiRequest(
            "/fixtures?live=all"
        );

        liveMatches = data.response || [];

        /*
           Sort by league name.
        */

        liveMatches.sort(
            (a, b) =>
                (a.league?.name || "")
                .localeCompare(
                    b.league?.name || ""
                )
        );


        document.getElementById(
            "connection"
        ).textContent =
            "● Live connection";


        updateTime();

        renderCurrentTab();

    } catch (error) {

        showError(error.message);

    } finally {

        liveLoading = false;
    }
}


/* =====================================================
   UPCOMING MATCHES
   ===================================================== */

async function loadUpcoming(force = false) {

    /*
       Check local cache first.
    */

    if (!force) {

        const cached =
            getCache("upcoming");

        if (cached) {

            upcomingMatches =
                cached.response || [];

            upcomingTotalPages =
                cached.totalPages || 1;

            renderCurrentTab();

            return;
        }
    }


    try {

        showLoading();

        const today =
            nigeriaDate(0);

        const future =
            nigeriaDate(UPCOMING_DAYS);


        /*
           We request only the selected API page.

           This saves API requests.
        */

        const endpoint =
            "/fixtures" +
            "?from=" + today +
            "&to=" + future +
            "&timezone=Africa/Lagos" +
            "&page=" + upcomingPage;


        const data =
            await apiRequest(endpoint);


        upcomingMatches =
            data.response || [];


        upcomingTotalPages =
            Number(
                data.paging?.total || 1
            );


        /*
           Save this page temporarily.
        */

        saveCache(
            "upcoming",
            {
                response:
                    upcomingMatches,

                totalPages:
                    upcomingTotalPages
            }
        );


        updateTime();

        renderCurrentTab();


    } catch (error) {

        showError(error.message);

    }
}


/* =====================================================
   FINISHED MATCHES
   ===================================================== */

async function loadFinished(force = false) {

    if (!force) {

        const cached =
            getCache("finished");

        if (cached) {

            finishedMatches =
                cached.response || [];

            finishedTotalPages =
                cached.totalPages || 1;

            renderCurrentTab();

            return;
        }
    }


    try {

        showLoading();


        const fromDate =
            nigeriaDate(
                -FINISHED_DAYS
            );

        const today =
            nigeriaDate(0);


        const endpoint =
            "/fixtures" +
            "?from=" + fromDate +
            "&to=" + today +
            "&timezone=Africa/Lagos" +
            "&page=" + finishedPage;


        const data =
            await apiRequest(endpoint);


        /*
           Keep only completed matches.
        */

        finishedMatches =
            (data.response || [])
            .filter(
                match =>
                    isFinished(match)
            );


        finishedTotalPages =
            Number(
                data.paging?.total || 1
            );


        saveCache(
            "finished",
            {
                response:
                    finishedMatches,

                totalPages:
                    finishedTotalPages
            }
        );


        updateTime();

        renderCurrentTab();


    } catch (error) {

        showError(error.message);

    }
}


/* =====================================================
   STATUS FUNCTIONS
   ===================================================== */

function isLive(match) {

    const status =
        match.fixture?.status?.short;

    return [
        "1H",
        "HT",
        "2H",
        "ET",
        "BT",
        "P",
        "LIVE"
    ].includes(status);
}


function isFinished(match) {

    const status =
        match.fixture?.status?.short;

    return [
        "FT",
        "AET",
        "PEN"
    ].includes(status);
}


function isUpcoming(match) {

    const status =
        match.fixture?.status?.short;

    return [
        "NS",
        "TBD"
    ].includes(status);
}


/* =====================================================
   TAB CHANGING
   ===================================================== */

function changeTab(tab) {

    currentTab = tab;


    document
        .querySelectorAll(".tab")
        .forEach(
            button =>
                button.classList.remove(
                    "active"
                )
        );


    if (tab === "live") {

        document
            .getElementById("tabLive")
            .classList.add("active");

        if (
            liveMatches.length === 0
        ) {

            loadLiveMatches();

        } else {

            renderCurrentTab();
        }

    }


    else if (tab === "upcoming") {

        document
            .getElementById("tabUpcoming")
            .classList.add("active");

        loadUpcoming();

    }


    else if (tab === "finished") {

        document
            .getElementById("tabFinished")
            .classList.add("active");

        loadFinished();

    }
}


/* =====================================================
   RENDER CURRENT TAB
   ===================================================== */

function renderCurrentTab() {

    clearError();

    if (currentTab === "live") {

        renderMatches(
            liveMatches,
            "live"
        );

        return;
    }


    if (currentTab === "upcoming") {

        renderMatches(
            upcomingMatches,
            "upcoming"
        );

        renderPagination(
            upcomingPage,
            upcomingTotalPages,
            "upcoming"
        );

        return;
    }


    if (currentTab === "finished") {

        renderMatches(
            finishedMatches,
            "finished"
        );

        renderPagination(
            finishedPage,
            finishedTotalPages,
            "finished"
        );

        return;
    }
}


/* =====================================================
   RENDER MATCHES
   ===================================================== */

function renderMatches(
    matches,
    type
) {

    const content =
        document.getElementById(
            "content"
        );


    if (
        !matches ||
        matches.length === 0
    ) {

        let text =
            "No matches found.";

        if (type === "live") {

            text =
                "No live matches right now.";

        }

        if (type === "upcoming") {

            text =
                "No upcoming matches found.";

        }

        if (type === "finished") {

            text =
                "No finished matches found.";

        }


        content.innerHTML = `

            <div class="empty">

                <div class="empty-ball">
                    ⚽
                </div>

                <div class="empty-text">
                    ${text}
                </div>

            </div>

        `;

        return;
    }


    let html = "";


    matches.forEach(
        match => {

            html +=
                createMatchCard(
                    match,
                    type
                );

        }
    );


    content.innerHTML = html;
}


/* =====================================================
   MATCH CARD
   ===================================================== */

function createMatchCard(
    match,
    type
) {

    const home =
        match.teams?.home;

    const away =
        match.teams?.away;

    const league =
        match.league;

    const fixture =
        match.fixture;

    const status =
        fixture?.status;


    const homeName =
        home?.name ||
        "Home";

    const awayName =
        away?.name ||
        "Away";


    const homeLogo =
        home?.logo ||
        "https://via.placeholder.com/50?text=⚽";

    const awayLogo =
        away?.logo ||
        "https://via.placeholder.com/50?text=⚽";


    let statusText =
        status?.long ||
        "";


    let statusClass =
        "";


    let homeScore =
        home?.goals;

    let awayScore =
        away?.goals;


    /*
       LIVE
    */

    if (type === "live") {

        statusClass = "live";


        if (
            status?.elapsed
        ) {

            statusText =
                status.elapsed + "'";

        }

        else {

            statusText =
                status?.short ||
                "LIVE";

        }
    }


    /*
       FINISHED
    */

    else if (type === "finished") {

        statusClass =
            "finished";

        statusText =
            status?.short ||
            "FT";
    }


    /*
       UPCOMING
    */

    else {

        statusClass =
            "upcoming";

        homeScore = "-";

        awayScore = "-";

        statusText =
            formatNigeriaTime(
                fixture?.date
            );
    }


    /*
       League information.
    */

    const leagueName =
        league?.name ||
        "Football";

    const country =
        league?.country ||
        "";


    /*
       Date for finished/upcoming.
    */

    let dateText = "";


    if (
        fixture?.date &&
        type !== "live"
    ) {

        dateText =
            formatNigeriaDate(
                fixture.date
            );

    }


    return `

        <div class="match-card">

            <div class="league">

                <div class="league-name">

                    ${escapeHTML(
                        leagueName
                    )}

                    ${
                        country
                        ? " • " +
                          escapeHTML(country)
                        : ""
                    }

                </div>

                <div class="match-date">

                    ${dateText}

                </div>

            </div>


            <div class="teams">

                <div class="team">

                    <img
                        src="${homeLogo}"
                        alt=""
                        onerror="
                        this.src='https://via.placeholder.com/50?text=⚽'
                        "
                    >

                    <div class="team-name">

                        ${escapeHTML(
                            homeName
                        )}

                    </div>

                </div>


                <div class="score-area">

                    <div class="score">

                        ${homeScore}
                        -
                        ${awayScore}

                    </div>

                    <div class="
                        status
                        ${statusClass}
                    ">

                        ${statusText}

                    </div>

                </div>


                <div class="team">

                    <img
                        src="${awayLogo}"
                        alt=""
                        onerror="
                        this.src='https://via.placeholder.com/50?text=⚽'
                        "
                    >

                    <div class="team-name">

                        ${escapeHTML(
                            awayName
                        )}

                    </div>

                </div>

            </div>

        </div>

    `;
}


/* =====================================================
   PAGINATION
   ===================================================== */

function renderPagination(
    page,
    totalPages,
    type
) {

    const content =
        document.getElementById(
            "content"
        );


    /*
       Don't show pagination
       if there is only one page.
    */

    if (
        totalPages <= 1
    ) {

        return;

    }


    /*
       Limit the number displayed
       so the UI stays clean.
    */

    const safeTotal =
        Math.min(
            totalPages,
            999
        );


    const pagination =
        document.createElement(
            "div"
        );


    pagination.className =
        "pagination";


    pagination.innerHTML = `

        <button
            class="page-btn"
            onclick="
                previousPage('${type}')
            "
            ${page <= 1 ? "disabled" : ""}
        >
            ← Previous
        </button>


        <div class="page-info">

            Page ${page}
            of
            ${safeTotal}

        </div>


        <button
            class="page-btn"
            onclick="
                nextPage('${type}')
            "
            ${page >= safeTotal ? "disabled" : ""}
        >
            Next →
        </button>

    `;


    content.appendChild(
        pagination
    );
}


/* =====================================================
   NEXT PAGE
   ===================================================== */

function nextPage(type) {

    if (type === "upcoming") {

        if (
            upcomingPage <
            upcomingTotalPages
        ) {

            upcomingPage++;

            /*
               Remove cache because
               this is a different page.
            */

            removeCache(
                "upcoming"
            );

            loadUpcoming(true);
        }

    }


    else if (type === "finished") {

        if (
            finishedPage <
            finishedTotalPages
        ) {

            finishedPage++;

            removeCache(
                "finished"
            );

            loadFinished(true);
        }
    }
}


/* =====================================================
   PREVIOUS PAGE
   ===================================================== */

function previousPage(type) {

    if (type === "upcoming") {

        if (
            upcomingPage > 1
        ) {

            upcomingPage--;

            removeCache(
                "upcoming"
            );

            loadUpcoming(true);
        }

    }


    else if (type === "finished") {

        if (
            finishedPage > 1
        ) {

            finishedPage--;

            removeCache(
                "finished"
            );

            loadFinished(true);
        }
    }
}


/* =====================================================
   LOCAL STORAGE CACHE
   ===================================================== */

function saveCache(
    name,
    data
) {

    try {

        localStorage.setItem(
            "football_" + name,

            JSON.stringify({
                time: Date.now(),
                data: data
            })
        );

    } catch (e) {

        console.log(
            "Cache error",
            e
        );

    }
}


function getCache(name) {

    try {

        const raw =
            localStorage.getItem(
                "football_" + name
            );


        if (!raw) {
            return null;
        }


        const saved =
            JSON.parse(raw);


        /*
           Cache expires after 10 minutes.
        */

        if (
            Date.now() -
            saved.time >
            CACHE_TIME
        ) {

            localStorage.removeItem(
                "football_" + name
            );

            return null;
        }


        return saved.data;

    } catch (e) {

        return null;
    }
}


function removeCache(name) {

    try {

        localStorage.removeItem(
            "football_" + name
        );

    } catch (e) {}
}


/* =====================================================
   MANUAL REFRESH
   ===================================================== */

async function manualRefresh() {

    clearError();

    document.getElementById(
        "connection"
    ).textContent =
        "Refreshing...";


    /*
       Always refresh Live.
    */

    await loadLiveMatches();


    /*
       Refresh the currently selected
       Upcoming/Finished tab only.
    */

    if (
        currentTab === "upcoming"
    ) {

        removeCache("upcoming");

        await loadUpcoming(true);

    }


    if (
        currentTab === "finished"
    ) {

        removeCache("finished");

        await loadFinished(true);

    }
}


/* =====================================================
   AUTOMATIC LIVE REFRESH
   ===================================================== */

/*
   Only Live is automatically refreshed.

   Upcoming and Finished are NOT
   repeatedly requested.

   This saves API requests.
*/

setInterval(
    function() {

        /*
           Refresh live data
           regardless of current tab.
        */

        loadLiveMatches();

    },
    LIVE_REFRESH_TIME
);


/* =====================================================
   TIME DISPLAY
   ===================================================== */

function formatNigeriaTime(
    dateString
) {

    if (!dateString) {
        return "";
    }


    try {

        const date =
            new Date(dateString);


        return date.toLocaleTimeString(
            "en-NG",
            {
                timeZone:
                    "Africa/Lagos",

                hour:
                    "2-digit",

                minute:
                    "2-digit",

                hour12:
                    true
            }
        );

    } catch (e) {

        return "";
    }
}


function formatNigeriaDate(
    dateString
) {

    if (!dateString) {
        return "";
    }


    try {

        const date =
            new Date(dateString);


        return date.toLocaleDateString(
            "en-NG",
            {
                timeZone:
                    "Africa/Lagos",

                day:
                    "numeric",

                month:
                    "short"
            }
        );

    } catch (e) {

        return "";
    }
}


/* =====================================================
   LAST UPDATED
   ===================================================== */

function updateTime() {

    const now =
        new Date();


    const text =
        now.toLocaleTimeString(
            "en-NG",
            {
                timeZone:
                    "Africa/Lagos",

                hour:
                    "2-digit",

                minute:
                    "2-digit",

                second:
                    "2-digit",

                hour12:
                    true
            }
        );


    document.getElementById(
        "updated"
    ).textContent =
        "Last updated: " + text;
}

/* =====================================================
   SECURITY / HTML ESCAPING
   ===================================================== */

function escapeHTML(
    text
) {

    if (
        text === null ||
        text === undefined
    ) {

        return "";

    }


    return String(text)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}
