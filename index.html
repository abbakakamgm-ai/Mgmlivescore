<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Football Live Scores</title>


<style>

/* =========================
   BASIC
========================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f6f9;
    color:#17202a;
    padding-bottom:40px;
}


/* =========================
   HEADER
========================= */

.header{

    background:
    linear-gradient(
        135deg,
        #061b45,
        #075cff
    );

    color:white;

    padding:25px 18px 28px;

    border-radius:
    0 0 28px 28px;
}

.header h1{

    font-size:28px;

    margin-bottom:7px;
}

.header p{

    font-size:14px;

    opacity:.85;
}


.refresh-row{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-top:22px;
}

#lastUpdate{

    font-size:13px;

    opacity:.9;
}

.refresh-btn{

    border:0;

    background:white;

    color:#075cff;

    padding:12px 18px;

    border-radius:25px;

    font-size:15px;

    font-weight:bold;
}


/* =========================
   TABS
========================= */

.tabs{

    display:flex;

    gap:10px;

    overflow-x:auto;

    padding:18px 15px 12px;

    scrollbar-width:none;
}

.tabs::-webkit-scrollbar{
    display:none;
}

.tab{

    flex:none;

    border:0;

    background:white;

    color:#555;

    padding:12px 22px;

    border-radius:25px;

    font-size:15px;

    font-weight:bold;

    box-shadow:
    0 2px 8px rgba(0,0,0,.05);
}

.tab.active{

    background:#075cff;

    color:white;
}


/* =========================
   LOADING
========================= */

.loading{

    text-align:center;

    padding:50px 20px;

    color:#777;
}

.spinner{

    width:40px;

    height:40px;

    border:
    4px solid #ddd;

    border-top:
    4px solid #075cff;

    border-radius:50%;

    margin:
    0 auto 15px;

    animation:
    spin 1s linear infinite;
}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}


/* =========================
   ERROR
========================= */

#error{

    display:none;

    margin:10px 15px;

    padding:15px;

    border-radius:14px;

    background:#ffe7e7;

    color:#c62828;

    font-size:14px;

    word-break:break-word;
}


/* =========================
   SECTION TITLE
========================= */

.section-title{

    padding:
    8px 16px 10px;

    font-size:19px;

    font-weight:bold;
}


/* =========================
   MATCH
========================= */

.match{

    background:white;

    margin:
    10px 15px;

    border-radius:18px;

    padding:15px;

    box-shadow:
    0 3px 15px rgba(0,0,0,.06);
}


/* =========================
   LEAGUE
========================= */

.league{

    display:flex;

    align-items:center;

    gap:8px;

    padding-bottom:12px;

    margin-bottom:14px;

    border-bottom:
    1px solid #eee;
}

.league-logo{

    width:28px;

    height:28px;

    object-fit:contain;
}

.league-name{

    font-size:12px;

    color:#777;

    font-weight:bold;
}


/* =========================
   TEAMS
========================= */

.match-row{

    display:grid;

    grid-template-columns:
    1fr 80px 1fr;

    align-items:center;

    text-align:center;
}

.team{

    font-size:13px;

    font-weight:bold;

    line-height:1.3;
}

.team-logo{

    display:block;

    width:45px;

    height:45px;

    object-fit:contain;

    margin:
    0 auto 8px;
}


/* =========================
   SCORE
========================= */

.score{

    font-size:23px;

    font-weight:bold;
}

.status{

    margin-top:6px;

    font-size:11px;

    font-weight:bold;

    color:#777;
}

.live{

    color:#e53935;
}

.live-dot{

    display:inline-block;

    width:8px;

    height:8px;

    background:#e53935;

    border-radius:50%;

    margin-right:4px;
}


/* =========================
   EMPTY
========================= */

.empty{

    text-align:center;

    padding:65px 20px;

    color:#777;
}

.empty-ball{

    font-size:55px;

    margin-bottom:12px;
}


/* =========================
   FOOTER
========================= */

.footer{

    text-align:center;

    color:#999;

    font-size:12px;

    margin-top:30px;
}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<div class="header">

    <h1>⚽ Football Live</h1>

    <p>
        Live scores from around the world
    </p>

    <div class="refresh-row">

        <span id="lastUpdate">
            Connecting...
        </span>

        <button
            class="refresh-btn"
            onclick="loadAll()">

            ↻ Refresh

        </button>

    </div>

</div>



<!-- =========================
     TABS
========================= -->

<div class="tabs">

    <button
        class="tab active"
        onclick="changeTab('live',this)">

        🔴 Live

    </button>


    <button
        class="tab"
        onclick="changeTab('today',this)">

        📅 Today

    </button>


    <button
        class="tab"
        onclick="changeTab('finished',this)">

        ✅ Finished

    </button>


    <button
        class="tab"
        onclick="changeTab('upcoming',this)">

        🕐 Upcoming

    </button>

</div>



<!-- =========================
     ERROR
========================= -->

<div id="error"></div>



<!-- =========================
     LOADING
========================= -->

<div
    id="loading"
    class="loading">

    <div class="spinner"></div>

    Loading football matches...

</div>



<!-- =========================
     MATCHES
========================= -->

<div id="matches"></div>



<div class="footer">

    Football Live Scores

</div>



<script>


/* =====================================================
   🔑 YOUR API KEY
   ===================================================== */

const API_KEY =
"361e4f7ff57c7a637472fd45f194a525";


/* =====================================================
   API
   ===================================================== */

const API_URL =
"https://v3.football.api-sports.io";


/* =====================================================
   VARIABLES
   ===================================================== */

let liveMatches = [];

let todayMatches = [];

let tomorrowMatches = [];

let currentTab = "live";


/* =====================================================
   DATE FUNCTION
   ===================================================== */

function getDate(offset = 0){

    const date = new Date();

    date.setDate(
        date.getDate() + offset
    );

    const year =
        date.getFullYear();

    const month =
        String(
            date.getMonth() + 1
        ).padStart(2,"0");

    const day =
        String(
            date.getDate()
        ).padStart(2,"0");

    return (
        year +
        "-" +
        month +
        "-" +
        day
    );
}


/* =====================================================
   API REQUEST
   ===================================================== */

async function apiRequest(endpoint){

    const response =
        await fetch(
            API_URL + endpoint,
            {
                method:"GET",

                headers:{
                    "x-apisports-key":
                    API_KEY
                }
            }
        );


    if(!response.ok){

        throw new Error(
            "HTTP " +
            response.status
        );

    }


    const data =
        await response.json();


    console.log(
        "API:",
        endpoint,
        data
    );


    if(
        data.errors &&
        Object.keys(data.errors).length > 0
    ){

        throw new Error(
            JSON.stringify(
                data.errors
            )
        );

    }


    return data.response || [];

}


/* =====================================================
   LOAD EVERYTHING
===================================================== */

async function loadAll(){

    const loading =
        document.getElementById(
            "loading"
        );

    const error =
        document.getElementById(
            "error"
        );


    loading.style.display =
        "block";

    error.style.display =
        "none";


    document.getElementById(
        "matches"
    ).innerHTML = "";


    /* CHECK API KEY */

    if(
        !API_KEY ||
        API_KEY ===
        "PASTE_YOUR_API_KEY_HERE"
    ){

        loading.style.display =
            "none";

        error.style.display =
            "block";

        error.innerHTML =
            "⚠️ Put your API-Football API key in the code first.";

        return;

    }


    try{

        const today =
            getDate(0);

        const tomorrow =
            getDate(1);


        /*
         * REQUEST 1
         * LIVE WORLDWIDE
         */

        liveMatches =
            await apiRequest(
                "/fixtures?live=all"
            );


        /*
         * REQUEST 2
         * TODAY
         */

        todayMatches =
            await apiRequest(
                "/fixtures?date=" +
                today +
                "&timezone=Africa/Lagos"
            );


        /*
         * REQUEST 3
         * TOMORROW
         */

        tomorrowMatches =
            await apiRequest(
                "/fixtures?date=" +
                tomorrow +
                "&timezone=Africa/Lagos"
            );


        document.getElementById(
            "lastUpdate"
        ).innerText =
            "Updated " +
            new Date()
            .toLocaleTimeString();


        loading.style.display =
            "none";


        displayMatches();


    }

    catch(errorObject){

        console.log(
            "API ERROR:",
            errorObject
        );


        loading.style.display =
            "none";


        error.style.display =
            "block";


        error.innerHTML =

            "❌ API ERROR<br><br>" +

            errorObject.message +

            "<br><br>" +

            "Check that your API key is valid and that your API-Football account has available requests.";

    }

}


/* =====================================================
   LIVE
===================================================== */

function isLive(match){

    const status =
        match.fixture.status.short;


    return [

        "1H",
        "2H",
        "HT",
        "ET",
        "P",
        "LIVE"

    ].includes(status);

}


/* =====================================================
   FINISHED
===================================================== */

function isFinished(match){

    const status =
        match.fixture.status.short;


    return [

        "FT",
        "AET",
        "PEN"

    ].includes(status);

}


/* =====================================================
   UPCOMING
===================================================== */

function isUpcoming(match){

    return !isLive(match)
        &&
        !isFinished(match);

}


/* =====================================================
   DISPLAY
===================================================== */

function displayMatches(){

    const container =
        document.getElementById(
            "matches"
        );


    let matches = [];

    let title = "";


    /* =========================
       LIVE
    ========================= */

    if(currentTab === "live"){

        matches =
            liveMatches;

        title =
            "🔴 Live Matches";

    }


    /* =========================
       TODAY
    ========================= */

    else if(currentTab === "today"){

        matches =
            todayMatches;

        title =
            "📅 Today's Matches";

    }


    /* =========================
       FINISHED
    ========================= */

    else if(currentTab === "finished"){

        matches =
            todayMatches.filter(
                isFinished
            );

        title =
            "✅ Finished Matches";

    }


    /* =========================
       UPCOMING
    ========================= */

    else if(currentTab === "upcoming"){

        const todayUpcoming =
            todayMatches.filter(
                isUpcoming
            );


        const tomorrowUpcoming =
            tomorrowMatches.filter(
                isUpcoming
            );


        matches =
            [
                ...todayUpcoming,
                ...tomorrowUpcoming
            ];


        title =
            "🕐 Upcoming Matches";

    }


    /* REMOVE DUPLICATES */

    const unique = [];

    const ids = new Set();


    matches.forEach(match => {

        const id =
            match.fixture.id;

        if(!ids.has(id)){

            ids.add(id);

            unique.push(match);

        }

    });


    matches = unique;


    /* SORT BY TIME */

    matches.sort(
        (a,b) => {

            return new Date(
                a.fixture.date
            ) -
            new Date(
                b.fixture.date
            );

        }
    );


    /* EMPTY */

    if(matches.length === 0){

        let message =
            "No matches found.";


        if(currentTab === "live"){

            message =
                "No matches are live right now.";

        }

        if(currentTab === "finished"){

            message =
                "No finished matches found today.";

        }

        if(currentTab === "upcoming"){

            message =
                "No upcoming matches found.";

        }


        container.innerHTML = `

            <div class="empty">

                <div class="empty-ball">
                    ⚽
                </div>

                <div>
                    ${message}
                </div>

            </div>

        `;

        return;

    }


    /* TITLE */

    container.innerHTML = `

        <div class="section-title">

            ${title}

            (${matches.length})

        </div>

    `;


    /* CARDS */

    matches.forEach(
        match => {

            container.innerHTML +=
                createMatchCard(match);

        }
    );

}


/* =====================================================
   MATCH CARD
===================================================== */

function createMatchCard(match){

    const fixture =
        match.fixture;

    const teams =
        match.teams;

    const goals =
        match.goals;

    const league =
        match.league;


    const status =
        fixture.status.short;


    /* SCORE */

    const homeScore =
        goals.home !== null
        ? goals.home
        : "-";


    const awayScore =
        goals.away !== null
        ? goals.away
        : "-";


    /* STATUS */

    let statusText = "";


    if(isLive(match)){

        if(status === "HT"){

            statusText =
                `<span class="live">
                    🔴 HALF TIME
                </span>`;

        }

        else{

            const minute =
                fixture.status.elapsed
                ? fixture.status.elapsed + "'"
                : "LIVE";


            statusText =
                `<span class="live">
                    <span class="live-dot"></span>
                    ${minute}
                </span>`;

        }

    }


    else if(isFinished(match)){

        statusText =
            "FULL TIME";

    }


    else{

        const date =
            new Date(
                fixture.date
            );


        statusText =
            date.toLocaleTimeString(
                "en-NG",
                {
                    hour:"2-digit",
                    minute:"2-digit"
                }
            );

    }


    return `

        <div class="match">


            <div class="league">

                <img
                    class="league-logo"

                    src="${
                        league.logo || ""
                    }"

                    onerror="
                        this.style.display='none'
                    "
                >


                <div class="league-name">

                    ${
                        league.name ||
                        "Football"
                    }

                    ${
                        league.country
                        ? " • " +
                          league.country
                        : ""
                    }

                </div>

            </div>



            <div class="match-row">


                <!-- HOME -->

                <div class="team">

                    <img
                        class="team-logo"

                        src="${
                            teams.home.logo || ""
                        }"

                        onerror="
                            this.style.display='none'
                        "
                    >

                    ${
                        teams.home.name
                    }

                </div>



                <!-- SCORE -->

                <div>

                    <div class="score">

                        ${
                            homeScore
                        }

                        -

                        ${
                            awayScore
                        }

                    </div>


                    <div class="status">

                        ${
                            statusText
                        }

                    </div>

                </div>



                <!-- AWAY -->

                <div class="team">

                    <img
                        class="team-logo"

                        src="${
                            teams.away.logo || ""
                        }"

                        onerror="
                            this.style.display='none'
                        "
                    >

                    ${
                        teams.away.name
                    }

                </div>


            </div>

        </div>

    `;

}


/* =====================================================
   TAB
===================================================== */

function changeTab(
    tab,
    button
){

    currentTab =
        tab;


    document
        .querySelectorAll(".tab")
        .forEach(
            btn => {

                btn.classList.remove(
                    "active"
                );

            }
        );


    button.classList.add(
        "active"
    );


    displayMatches();

}


/* =====================================================
   AUTO REFRESH
===================================================== */

/*
 * Refresh every 60 seconds.
 *
 * This is deliberately 60 seconds rather
 * than 15 seconds to reduce API usage.
 */

setInterval(
    loadAll,
    60000
);


/* =====================================================
   START
===================================================== */

loadAll();


</script>

</body>

</html>
