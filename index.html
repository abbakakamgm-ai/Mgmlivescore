<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Football Live Scores</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f3f5f7;
    color: #17202a;
    padding-bottom: 30px;
}

.header {
    background: linear-gradient(135deg, #071d49, #0b5cff);
    color: white;
    padding: 20px 16px;
    border-radius: 0 0 22px 22px;
}

.header h1 {
    font-size: 25px;
    margin-bottom: 5px;
}

.header p {
    opacity: .85;
    font-size: 13px;
}

.refresh {
    margin-top: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.refresh button {
    border: none;
    background: white;
    color: #075cff;
    padding: 9px 14px;
    border-radius: 20px;
    font-weight: bold;
}

.tabs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 15px;
}

.tabs button {
    border: none;
    padding: 10px 18px;
    border-radius: 20px;
    background: white;
    color: #555;
    white-space: nowrap;
    font-weight: bold;
}

.tabs button.active {
    background: #075cff;
    color: white;
}

#loading {
    text-align: center;
    padding: 30px;
    color: #666;
}

#error {
    display: none;
    margin: 15px;
    background: #ffe6e6;
    color: #c62828;
    padding: 15px;
    border-radius: 12px;
}

.section-title {
    padding: 5px 15px 10px;
    font-size: 18px;
    font-weight: bold;
}

.match {
    background: white;
    margin: 10px 15px;
    padding: 15px;
    border-radius: 16px;
    box-shadow: 0 3px 12px rgba(0,0,0,.06);
}

.league {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: #777;
    margin-bottom: 14px;
}

.league img {
    width: 25px;
    height: 25px;
    object-fit: contain;
}

.match-content {
    display: grid;
    grid-template-columns: 1fr 70px 1fr;
    align-items: center;
    text-align: center;
}

.team {
    font-size: 13px;
    font-weight: bold;
}

.team img {
    display: block;
    width: 42px;
    height: 42px;
    object-fit: contain;
    margin: 0 auto 7px;
}

.score {
    font-size: 22px;
    font-weight: bold;
}

.status {
    margin-top: 6px;
    font-size: 11px;
    font-weight: bold;
    color: #777;
}

.live {
    color: #e53935;
}

.live-dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    background: #e53935;
    border-radius: 50%;
    margin-right: 4px;
}

.empty {
    text-align: center;
    padding: 40px 20px;
    color: #777;
}

.footer {
    text-align: center;
    color: #888;
    font-size: 11px;
    padding: 20px;
}

.search-box {
    margin: 0 15px 10px;
}

.search-box input {
    width: 100%;
    border: none;
    background: white;
    padding: 13px 16px;
    border-radius: 25px;
    outline: none;
    box-shadow: 0 2px 8px rgba(0,0,0,.05);
}
</style>
</head>

<body>

<div class="header">
    <h1>⚽ Football Live</h1>
    <p>Live scores from around the world</p>

    <div class="refresh">
        <span id="lastUpdate">Loading...</span>
        <button onclick="loadMatches()">↻ Refresh</button>
    </div>
</div>

<div class="tabs">
    <button class="active" onclick="changeTab('live', this)">🔴 Live</button>
    <button onclick="changeTab('today', this)">Today</button>
    <button onclick="changeTab('finished', this)">Finished</button>
    <button onclick="changeTab('upcoming', this)">Upcoming</button>
</div>

<div class="search-box">
    <input
        type="text"
        id="search"
        placeholder="Search team..."
        oninput="displayMatches()"
    >
</div>

<div id="error"></div>

<div id="loading">
    Loading matches...
</div>

<div id="matches"></div>

<div class="footer">
    Football Live Scores
</div>

<script>

/* =====================================================
   PUT YOUR API-FOOTBALL API KEY HERE
   ===================================================== */

const API_KEY = "361e4f7ff57c7a637472fd45f194a525";


/* =====================================================
   API SETTINGS
   ===================================================== */

const API_URL = "https://v3.football.api-sports.io";

let allMatches = [];
let currentTab = "live";


/* =====================================================
   LOAD LIVE MATCHES
   ===================================================== */

async function loadMatches() {

    const loading = document.getElementById("loading");
    const error = document.getElementById("error");

    loading.style.display = "block";
    error.style.display = "none";

    if (API_KEY === "PASTE_YOUR_API_KEY_HERE") {
        loading.style.display = "none";
        error.style.display = "block";
        error.innerHTML =
            "⚠️ Please put your API-Football API key in the code.";
        return;
    }

    try {

        const response = await fetch(
            API_URL + "/fixtures?live=all",
            {
                method: "GET",
                headers: {
                    "x-apisports-key": API_KEY
                }
            }
        );

        if (!response.ok) {
            throw new Error("API request failed");
        }

        const data = await response.json();

        allMatches = data.response || [];

        document.getElementById("lastUpdate").innerText =
            "Updated " + new Date().toLocaleTimeString();

        loading.style.display = "none";

        displayMatches();

    } catch (err) {

        console.log(err);

        loading.style.display = "none";
        error.style.display = "block";

        error.innerHTML =
            "❌ Unable to load scores. Check your API key or internet connection.";
    }
}


/* =====================================================
   DISPLAY MATCHES
   ===================================================== */

function displayMatches() {

    const container = document.getElementById("matches");

    const search =
        document.getElementById("search").value.toLowerCase();

    let matches = [...allMatches];

    if (currentTab === "live") {

        matches = matches.filter(match =>
            match.fixture.status.short === "1H" ||
            match.fixture.status.short === "2H" ||
            match.fixture.status.short === "HT" ||
            match.fixture.status.short === "ET" ||
            match.fixture.status.short === "P"
        );

    } else if (currentTab === "finished") {

        matches = matches.filter(match =>
            ["FT", "AET", "P"].includes(
                match.fixture.status.short
            )
        );

    }

    if (search) {

        matches = matches.filter(match => {

            const home =
                match.teams.home.name.toLowerCase();

            const away =
                match.teams.away.name.toLowerCase();

            return home.includes(search) ||
                   away.includes(search);
        });
    }

    if (matches.length === 0) {

        container.innerHTML = `
            <div class="empty">
                <div style="font-size:40px">⚽</div>
                <p>No matches found</p>
            </div>
        `;

        return;
    }

    container.innerHTML = `
        <div class="section-title">
            ${currentTab === "live"
                ? "Live Matches"
                : "Matches"}
        </div>
    `;

    matches.forEach(match => {

        container.innerHTML += createMatchCard(match);

    });
}


/* =====================================================
   CREATE MATCH CARD
   ===================================================== */

function createMatchCard(match) {

    const fixture = match.fixture;
    const teams = match.teams;
    const league = match.league;
    const goals = match.goals;

    const status = fixture.status.short;

    let statusText = fixture.status.long;

    if (status === "1H" || status === "2H") {

        statusText =
            fixture.status.elapsed
            ? fixture.status.elapsed + "'"
            : "LIVE";

        statusText =
            `<span class="live">
                <span class="live-dot"></span>
                ${statusText}
             </span>`;
    }

    if (status === "HT") {
        statusText = "HALF TIME";
    }

    if (["FT", "AET"].includes(status)) {
        statusText = "FULL TIME";
    }

    const homeScore =
        goals.home !== null ? goals.home : "-";

    const awayScore =
        goals.away !== null ? goals.away : "-";

    return `

        <div class="match">

            <div class="league">

                <img
                    src="${league.logo || ''}"
                    onerror="this.style.display='none'"
                >

                <span>
                    ${league.name}
                    ${league.country ? " • " + league.country : ""}
                </span>

            </div>

            <div class="match-content">

                <div class="team">

                    <img
                        src="${teams.home.logo || ''}"
                        alt=""
                        onerror="this.style.display='none'"
                    >

                    ${teams.home.name}

                </div>

                <div>

                    <div class="score">
                        ${homeScore} - ${awayScore}
                    </div>

                    <div class="status">
                        ${statusText}
                    </div>

                </div>

                <div class="team">

                    <img
                        src="${teams.away.logo || ''}"
                        alt=""
                        onerror="this.style.display='none'"
                    >

                    ${teams.away.name}

                </div>

            </div>

        </div>
    `;
}


/* =====================================================
   CHANGE TAB
   ===================================================== */

function changeTab(tab, button) {

    currentTab = tab;

    document
        .querySelectorAll(".tabs button")
        .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");

    displayMatches();
}


/* =====================================================
   AUTO REFRESH
   ===================================================== */

setInterval(() => {

    if (currentTab === "live") {
        loadMatches();
    }

}, 30000);


/* =====================================================
   START APP
   ===================================================== */

loadMatches();

</script>

</body>
</html>
