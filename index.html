<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Football Live Scores</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f6f9;
    color:#18212f;
    padding-bottom:40px;
}

/* HEADER */

.header{
    background:linear-gradient(135deg,#071d49,#075cff);
    color:white;
    padding:25px 18px 28px;
    border-radius:0 0 28px 28px;
}

.header h1{
    font-size:28px;
    margin-bottom:7px;
}

.header p{
    font-size:14px;
    opacity:.85;
}

.refresh-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:22px;
}

#lastUpdate{
    font-size:13px;
    opacity:.9;
}

.refresh-btn{
    background:white;
    color:#075cff;
    border:0;
    padding:12px 18px;
    border-radius:25px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

/* TABS */

.tabs{
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding:18px 15px 12px;
    scrollbar-width:none;
}

.tabs::-webkit-scrollbar{
    display:none;
}

.tab{
    flex:none;
    border:0;
    background:white;
    color:#555;
    padding:12px 22px;
    border-radius:25px;
    font-size:15px;
    font-weight:bold;
    box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.tab.active{
    background:#075cff;
    color:white;
}

/* SEARCH */

.search{
    padding:5px 15px 15px;
}

.search input{
    width:100%;
    border:0;
    outline:0;
    background:white;
    padding:16px 20px;
    border-radius:30px;
    font-size:16px;
    box-shadow:0 3px 12px rgba(0,0,0,.06);
}

/* LOADING */

.loading{
    text-align:center;
    padding:45px 20px;
    color:#777;
}

.spinner{
    width:40px;
    height:40px;
    border:4px solid #ddd;
    border-top:4px solid #075cff;
    border-radius:50%;
    margin:0 auto 15px;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* ERROR */

#error{
    display:none;
    margin:10px 15px;
    padding:15px;
    border-radius:14px;
    background:#ffe8e8;
    color:#c62828;
    font-size:14px;
}

/* SECTION */

.section-title{
    padding:5px 16px 8px;
    font-size:19px;
    font-weight:bold;
}

/* MATCH CARD */

.match{
    background:white;
    margin:10px 15px;
    border-radius:18px;
    padding:15px;
    box-shadow:0 3px 15px rgba(0,0,0,.06);
}

.league{
    display:flex;
    align-items:center;
    gap:8px;
    border-bottom:1px solid #eee;
    padding-bottom:12px;
    margin-bottom:14px;
}

.league-logo{
    width:28px;
    height:28px;
    object-fit:contain;
}

.league-name{
    font-size:12px;
    color:#777;
    font-weight:bold;
}

.match-row{
    display:grid;
    grid-template-columns:1fr 80px 1fr;
    align-items:center;
    text-align:center;
}

.team{
    font-size:13px;
    font-weight:bold;
    line-height:1.3;
}

.team-logo{
    display:block;
    width:45px;
    height:45px;
    object-fit:contain;
    margin:0 auto 8px;
}

.score{
    font-size:23px;
    font-weight:bold;
}

.match-status{
    margin-top:6px;
    font-size:11px;
    font-weight:bold;
    color:#777;
}

.live-status{
    color:#e53935;
}

.live-dot{
    display:inline-block;
    width:8px;
    height:8px;
    background:#e53935;
    border-radius:50%;
    margin-right:4px;
}

/* EMPTY */

.empty{
    text-align:center;
    padding:60px 20px;
    color:#777;
}

.empty-ball{
    font-size:55px;
    margin-bottom:12px;
}

/* FOOTER */

.footer{
    text-align:center;
    color:#999;
    font-size:12px;
    margin-top:25px;
}

</style>
</head>

<body>

<!-- HEADER -->

<div class="header">

    <h1>⚽ Football Live</h1>

    <p>Live scores from around the world</p>

    <div class="refresh-row">

        <span id="lastUpdate">
            Connecting...
        </span>

        <button class="refresh-btn" onclick="loadMatches()">
            ↻ Refresh
        </button>

    </div>

</div>


<!-- TABS -->

<div class="tabs">

    <button class="tab active"
            onclick="changeTab('live',this)">
        🔴 Live
    </button>

    <button class="tab"
            onclick="changeTab('today',this)">
        Today
    </button>

    <button class="tab"
            onclick="changeTab('finished',this)">
        Finished
    </button>

    <button class="tab"
            onclick="changeTab('upcoming',this)">
        Upcoming
    </button>

</div>


<!-- SEARCH -->

<div class="search">

    <input
        type="text"
        id="search"
        placeholder="Search team..."
        oninput="displayMatches()"
    >

</div>


<!-- ERROR -->

<div id="error"></div>


<!-- LOADING -->

<div id="loading" class="loading">

    <div class="spinner"></div>

    Loading football matches...

</div>


<!-- MATCHES -->

<div id="matches"></div>


<div class="footer">
    Football Live Scores
</div>


<script>

/* =========================================================
   🔑 PUT YOUR API KEY HERE
   ========================================================= */

const API_KEY = "361e4f7ff57c7a637472fd45f194a525";


/* =========================================================
   API URL
   ========================================================= */

const API_URL = "https://v3.football.api-sports.io";


/* =========================================================
   VARIABLES
   ========================================================= */

let allMatches = [];

let currentTab = "live";


/* =========================================================
   GET TODAY'S DATE
   ========================================================= */

function getToday(){

    const today = new Date();

    const year = today.getFullYear();

    const month =
        String(today.getMonth() + 1).padStart(2,"0");

    const day =
        String(today.getDate()).padStart(2,"0");

    return year + "-" + month + "-" + day;
}


/* =========================================================
   LOAD MATCHES
   ========================================================= */

async function loadMatches(){

    const loading =
        document.getElementById("loading");

    const error =
        document.getElementById("error");

    loading.style.display = "block";

    error.style.display = "none";

    document.getElementById("matches").innerHTML = "";


    /* CHECK API KEY */

    if(
        API_KEY === "PASTE_YOUR_API_KEY_HERE" ||
        API_KEY.trim() === ""
    ){

        loading.style.display = "none";

        error.style.display = "block";

        error.innerHTML =
            "⚠️ Please put your API-Football API key in the code.";

        return;
    }


    try{

        const today = getToday();


        /*
         * Get ALL matches scheduled for today.
         */

        const url =
            API_URL +
            "/fixtures?date=" +
            today;


        const response =
            await fetch(
                url,
                {
                    method:"GET",

                    headers:{
                        "x-apisports-key":API_KEY
                    }
                }
            );


        if(!response.ok){

            throw new Error(
                "HTTP Error " + response.status
            );

        }


        const data =
            await response.json();


        console.log("API RESPONSE:",data);


        if(data.errors && Object.keys(data.errors).length > 0){

            throw new Error(
                JSON.stringify(data.errors)
            );

        }


        allMatches =
            data.response || [];


        document.getElementById("lastUpdate").innerText =
            "Updated " +
            new Date().toLocaleTimeString();


        loading.style.display = "none";


        displayMatches();


    }catch(err){

        console.log("ERROR:",err);


        loading.style.display = "none";

        error.style.display = "block";

        error.innerHTML =
            "❌ Could not load football matches.<br><br>" +
            "Please check your API key and internet connection.<br><br>" +
            "<small>" +
            err.message +
            "</small>";

    }

}


/* =========================================================
   CHECK LIVE MATCH
   ========================================================= */

function isLive(match){

    const status =
        match.fixture.status.short;


    return [
        "1H",
        "2H",
        "HT",
        "ET",
        "P",
        "LIVE"
    ].includes(status);

}


/* =========================================================
   CHECK FINISHED
   ========================================================= */

function isFinished(match){

    const status =
        match.fixture.status.short;


    return [
        "FT",
        "AET",
        "PEN"
    ].includes(status);

}


/* =========================================================
   CHECK UPCOMING
   ========================================================= */

function isUpcoming(match){

    return !isLive(match) &&
           !isFinished(match);

}


/* =========================================================
   DISPLAY MATCHES
   ========================================================= */

function displayMatches(){

    const container =
        document.getElementById("matches");


    let matches =
        [...allMatches];


    /* TAB FILTER */

    if(currentTab === "live"){

        matches =
            matches.filter(isLive);

    }


    else if(currentTab === "finished"){

        matches =
            matches.filter(isFinished);

    }


    else if(currentTab === "upcoming"){

        matches =
            matches.filter(isUpcoming);

    }


    /* SEARCH */

    const search =
        document
        .getElementById("search")
        .value
        .toLowerCase()
        .trim();


    if(search){

        matches =
            matches.filter(match => {

                const home =
                    (match.teams.home.name || "")
                    .toLowerCase();

                const away =
                    (match.teams.away.name || "")
                    .toLowerCase();

                const league =
                    (match.league.name || "")
                    .toLowerCase();

                return home.includes(search) ||
                       away.includes(search) ||
                       league.includes(search);

            });

    }


    /* NO MATCHES */

    if(matches.length === 0){

        let message = "";

        if(currentTab === "live"){
            message = "No matches are live right now.";
        }

        else if(currentTab === "finished"){
            message = "No finished matches found today.";
        }

        else if(currentTab === "upcoming"){
            message = "No upcoming matches found today.";
        }

        else{
            message = "No matches found today.";
        }


        container.innerHTML = `

            <div class="empty">

                <div class="empty-ball">
                    ⚽
                </div>

                <div>
                    ${message}
                </div>

            </div>

        `;

        return;

    }


    /* SORT */

    matches.sort((a,b) => {

        return new Date(
            a.fixture.date
        ) - new Date(
            b.fixture.date
        );

    });


    /* TITLE */

    let title = "Today's Matches";


    if(currentTab === "live"){
        title = "🔴 Live Matches";
    }

    else if(currentTab === "finished"){
        title = "Finished Matches";
    }

    else if(currentTab === "upcoming"){
        title = "Upcoming Matches";
    }


    container.innerHTML = `

        <div class="section-title">
            ${title}
            (${matches.length})
        </div>

    `;


    /* MATCH CARDS */

    matches.forEach(match => {

        container.innerHTML +=
            createMatchCard(match);

    });

}


/* =========================================================
   CREATE MATCH CARD
   ========================================================= */

function createMatchCard(match){

    const fixture =
        match.fixture;

    const teams =
        match.teams;

    const goals =
        match.goals;

    const league =
        match.league;


    const status =
        fixture.status.short;


    /* SCORES */

    const homeScore =
        goals.home !== null
        ? goals.home
        : "-";


    const awayScore =
        goals.away !== null
        ? goals.away
        : "-";


    /* STATUS TEXT */

    let statusText = "";


    if(isLive(match)){

        if(status === "HT"){

            statusText =
                '<span class="live-status">' +
                '🔴 HALF TIME' +
                '</span>';

        }

        else{

            const minute =
                fixture.status.elapsed
                ? fixture.status.elapsed + "'"
                : "LIVE";

            statusText =
                '<span class="live-status">' +
                '<span class="live-dot"></span>' +
                minute +
                '</span>';

        }

    }


    else if(isFinished(match)){

        statusText =
            "FULL TIME";

    }


    else{

        const date =
            new Date(fixture.date);


        statusText =
            date.toLocaleTimeString(
                [],
                {
                    hour:"2-digit",
                    minute:"2-digit"
                }
            );

    }


    return `

        <div class="match">

            <div class="league">

                <img
                    class="league-logo"
                    src="${league.logo || ""}"
                    onerror="this.style.display='none'"
                >

                <div class="league-name">

                    ${league.name || "Football"}

                    ${league.country
                        ? " • " + league.country
                        : ""}

                </div>

            </div>


            <div class="match-row">


                <!-- HOME -->

                <div class="team">

                    <img
                        class="team-logo"
                        src="${teams.home.logo || ""}"
                        onerror="this.style.display='none'"
                    >

                    ${teams.home.name}

                </div>


                <!-- SCORE -->

                <div>

                    <div class="score">

                        ${homeScore}
                        -
                        ${awayScore}

                    </div>


                    <div class="match-status">

                        ${statusText}

                    </div>

                </div>


                <!-- AWAY -->

                <div class="team">

                    <img
                        class="team-logo"
                        src="${teams.away.logo || ""}"
                        onerror="this.style.display='none'"
                    >

                    ${teams.away.name}

                </div>


            </div>

        </div>

    `;

}


/* =========================================================
   CHANGE TAB
   ========================================================= */

function changeTab(tab,button){

    currentTab = tab;


    document
        .querySelectorAll(".tab")
        .forEach(btn => {

            btn.classList.remove("active");

        });


    button.classList.add("active");


    displayMatches();

}


/* =========================================================
   AUTO REFRESH
   ========================================================= */

setInterval(

    function(){

        loadMatches();

    },

    30000

);


/* =========================================================
   START
   ========================================================= */

loadMatches();

</script>

</body>
</html>
